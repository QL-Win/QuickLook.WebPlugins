<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>excalidraw — Excalidraw Viewer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Top toolbar -->
  <header id="toolbar">
    <div id="toolbar-left">
      <!-- Open file button -->
      <label id="open-btn" class="btn" for="file-input" title="Open .excalidraw file" aria-label="Open file">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3.75l1.5 1.5h8.25A1.5 1.5 0 0 1 19.5 11v6a1.5 1.5 0 0 1-1.5 1.5H5.25A1.5 1.5 0 0 1 3.75 17V8.5z"/>
        </svg>
        <span>Open</span>
      </label>
      <input id="file-input" type="file" accept=".excalidraw,application/json" style="display:none" />

      <div class="separator"></div>

      <!-- Dark mode toggle -->
      <button id="theme-btn" class="btn" title="Toggle dark/light export theme" aria-pressed="false">
        <svg class="icon" id="theme-icon-dark" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon" id="theme-icon-light" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span id="theme-label">Light</span>
      </button>

      <div class="separator"></div>

      <!-- Zoom controls -->
      <button id="zoom-in-btn"  class="btn icon-btn" title="Zoom in (Ctrl++)">+</button>
      <button id="zoom-out-btn" class="btn icon-btn" title="Zoom out (Ctrl+-)">−</button>
      <button id="fit-btn"      class="btn icon-btn" title="Fit to view (Ctrl+0)">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M4 8V5h3M4 16v3h3M20 8V5h-3M20 16v3h-3"/>
        </svg>
      </button>
      <button id="reset-btn" class="btn" title="Actual size (Ctrl+1)">1:1</button>
    </div>

    <span id="title" class="toolbar-title">excalidraw</span>

    <div id="toolbar-right">
      <div id="status" hidden></div>
    </div>
  </header>

  <!-- Welcome / drop zone (shown when no file is loaded) -->
  <div id="welcome">
    <div id="drop-zone">
      <div class="drop-icon">
        <svg viewBox="0 0 80 60" width="80" height="60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Hand-drawn sketch icon -->
          <rect x="10" y="10" width="60" height="40" rx="6" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="4 2"/>
          <path d="M20 40 Q30 20 40 30 Q50 40 60 18" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="20" cy="40" r="3" fill="#a78bfa" opacity=".8"/>
          <circle cx="60" cy="18" r="3" fill="#a78bfa" opacity=".8"/>
        </svg>
      </div>
      <p class="drop-primary">Drop a <strong>.excalidraw</strong> file here</p>
      <p class="drop-secondary">or</p>
      <label class="btn btn-large" for="file-input" style="cursor:pointer">Choose file…</label>
      <p class="drop-hint">Exports the drawing as SVG — no server required</p>
    </div>
  </div>

  <!-- Main viewer (hidden until a file is loaded) -->
  <div id="viewer" hidden>
    <div id="graph-container">
      <div id="graph-canvas"></div>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>

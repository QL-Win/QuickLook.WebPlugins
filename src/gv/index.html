<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gv — Graphviz Viewer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Top toolbar -->
  <header id="toolbar">
    <div id="toolbar-left">
      <!-- Open file button -->
      <label id="open-btn" class="btn" for="file-input" title="Open .gv / .dot file" aria-label="Open file">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h3.75l1.5 1.5h8.25A1.5 1.5 0 0 1 19.5 11v6a1.5 1.5 0 0 1-1.5 1.5H5.25A1.5 1.5 0 0 1 3.75 17V8.5z"/>
        </svg>
        <span>Open</span>
      </label>
      <input id="file-input" type="file" accept=".gv,.dot,text/vnd.graphviz,text/plain" style="display:none" />

      <div class="separator"></div>

      <!-- Layout engine selector -->
      <label for="engine-select" class="toolbar-label">Engine:</label>
      <select id="engine-select" class="select" title="Graphviz layout engine">
        <option value="dot">dot</option>
        <option value="neato">neato</option>
        <option value="fdp">fdp</option>
        <option value="sfdp">sfdp</option>
        <option value="twopi">twopi</option>
        <option value="circo">circo</option>
        <option value="osage">osage</option>
        <option value="patchwork">patchwork</option>
      </select>

      <div class="separator"></div>

      <!-- Zoom controls -->
      <button id="zoom-in-btn"  class="btn icon-btn" title="Zoom in (Ctrl++)">+</button>
      <button id="zoom-out-btn" class="btn icon-btn" title="Zoom out (Ctrl+-)">−</button>
      <button id="fit-btn"      class="btn icon-btn" title="Fit to view (Ctrl+0)">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <path d="M4 8V5h3M4 16v3h3M20 8V5h-3M20 16v3h-3"/>
        </svg>
      </button>
      <button id="reset-btn" class="btn" title="Actual size (Ctrl+1)">1:1</button>
    </div>

    <span id="title" class="toolbar-title">gv</span>

    <div id="toolbar-right">
      <div id="status" hidden></div>
    </div>
  </header>

  <!-- Welcome / drop zone (shown when no file is loaded) -->
  <div id="welcome">
    <div id="drop-zone">
      <div class="drop-icon">
        <svg viewBox="0 0 80 60" width="80" height="60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="30" r="8" fill="#4fa3e0" opacity=".8"/>
          <circle cx="40" cy="10" r="8" fill="#4fa3e0" opacity=".8"/>
          <circle cx="68" cy="30" r="8" fill="#4fa3e0" opacity=".8"/>
          <circle cx="40" cy="50" r="8" fill="#4fa3e0" opacity=".8"/>
          <line x1="18" y1="26" x2="34" y2="14" stroke="#4fa3e0" stroke-width="2.5" opacity=".5"/>
          <line x1="46" y1="14" x2="62" y2="26" stroke="#4fa3e0" stroke-width="2.5" opacity=".5"/>
          <line x1="62" y1="34" x2="46" y2="46" stroke="#4fa3e0" stroke-width="2.5" opacity=".5"/>
          <line x1="34" y1="46" x2="18" y2="34" stroke="#4fa3e0" stroke-width="2.5" opacity=".5"/>
          <line x1="48" y1="16" x2="62" y2="28" stroke="#4fa3e0" stroke-width="2.5" opacity=".5"/>
        </svg>
      </div>
      <p class="drop-primary">Drop a <strong>.gv</strong> or <strong>.dot</strong> file here</p>
      <p class="drop-secondary">or</p>
      <label class="btn btn-large" for="file-input" style="cursor:pointer">Choose file…</label>
      <p class="drop-hint">Supports all Graphviz layout engines</p>
    </div>
  </div>

  <!-- Main viewer (hidden until a file is loaded) -->
  <div id="viewer" hidden>
    <div id="graph-container">
      <div id="graph-canvas"></div>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
